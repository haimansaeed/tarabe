<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طرب - محاكي Suno</title><style>body{margin:0;background:#000;color:#fff;font-family:system-ui;display:flex;justify-content:center;align-items:center;min-height:100vh} .box{width:92%;max-width:380px;background:#111;border:1px solid #222;border-radius:16px;padding:18px} h1{margin:0 0 10px;text-align:center;color:#d4af37} input,textarea,select{width:100%;background:#1e1e1e;color:#fff;border:1px solid #333;border-radius:10px;padding:12px;margin:6px 0} .btn{width:100%;background:#d4af37;color:#000;border:none;border-radius:24px;padding:14px;font-weight:900;margin-top:10px} audio{width:100%;margin-top:10px} .log{font-size:12px;color:#22c55e;background:#000;border:1px solid #222;border-radius:8px;padding:8px;margin-top:8px;min-height:40px;white-space:pre-wrap;direction:ltr}</style></head><body><div class="box"><h1>🎵 طرب - Suno أونلاين</h1><input id="k" type="password" placeholder="مفتاح hf_ المجاني من huggingface.co"><textarea id="p">حبيبي هيمان وينك من زمان - اغنية خليجية حزينة عود</textarea><input id="t" value="وينك من زمان"><select id="d"><option value="30">30 ثانية</option><option value="60">60 ثانية</option></select><button class="btn" onclick="go()">✨ ولّد مثل Suno</button><div class="log" id="log">الصق مفتاح hf_ واضغط ولّد</div><div id="out"></div></div><script>async function go(){let k=document.getElementById('k').value.trim(),p=document.getElementById('p').value,t=document.getElementById('t').value,log=document.getElementById('log'),out=document.getElementById('out');if(!k.startsWith('hf_')){log.textContent='الصق مفتاح hf_ من huggingface.co/settings/tokens';return}log.textContent='جاري التوليد أونلاين... 30 ثانية';try{let r=await fetch('https://api-inference.huggingface.co/models/facebook/musicgen-stereo-large',{method:'POST',headers:{'Authorization':'Bearer '+k,'Content-Type':'application/json'},body:JSON.stringify({inputs:p})});if(!r.ok){let x=await r.text();log.textContent='خطأ: '+x.slice(0,200)+'\nشغل VPN';return}let b=await r.blob(),u=URL.createObjectURL(b);out.innerHTML='<audio controls src='+u+'></audio><br><a href='+u+' download='+t+'.wav style=color:#d4af37>⬇️ تحميل</a>';log.textContent='✅ اكتمل أونلاين مثل Suno!'}catch(e){log.textContent='خطأ شبكة: '+e.message+' شغل VPN'}} </script></body></html>
